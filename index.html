<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ななしいんく配信アーカイブ</title>
<meta name="description" content="Vtuberの配信アーカイブを、配信者・ジャンル・コラボ相手のタグで検索できる一覧です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ななしいんく配信アーカイブ 公開サイト用スタイル
   色や文字は先頭の変数を書き換えるだけで変えられます。 */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --ink:#1A1D2B; --ink2:#565C70;
  --line:#DDE0EA; --line2:#C4CAD9;
  --accent:#D42A6B; --on-fill:#FFFFFF;
  --genre:#D42A6B; --genre-tint:#FBE3EC; --genre-ink:#A3154F;
  --sub:#5A55D6;   --sub-tint:#E6E5FA;   --sub-ink:#3F3AA8;
  --collab:#087880;--collab-tint:#D9F1F2;--collab-ink:#07646B;
  --mem-tint:#DDF3E4; --mem-ink:#14633A; --mute-bg:#E7E9F0;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --f-display:"M PLUS Rounded 1c","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101219; --surface:#181B26; --ink:#ECEEF6; --ink2:#A0A6BC;
    --line:#2A2E3E; --line2:#3C4157;
    --accent:#FF7FB0; --on-fill:#14111A;
    --genre:#FF7FB0; --genre-tint:#3A1B2A; --genre-ink:#FF9DC2;
    --sub:#A5A2FF;   --sub-tint:#25244A;   --sub-ink:#BDBBFF;
    --collab:#5FD6DE;--collab-tint:#123A3D;--collab-ink:#7FE3EA;
    --mem-tint:#12301F; --mem-ink:#7FDBA4; --mute-bg:#1D2029;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 64px;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto}

/* site header */
.site{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none}
.site nav{display:flex;gap:4px}
.site nav a{padding:8px 12px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500}
.site nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,34px);line-height:1.2;margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--ink2);font-size:13px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink2)}
.linkbtn{border:0;background:none;padding:6px 0;min-height:36px;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px;font-size:13px}
.linkbtn:hover{color:var(--ink)}

/* search bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:8px}
.search{flex:1;min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:0 18px;margin:-2px 0 8px}
.quick .opt{margin-top:0}
body.locked .quick{display:none}
.search input{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:16px;appearance:none;-webkit-appearance:none}
.search input::placeholder{color:var(--ink2)}
#fbtn{min-height:46px;border-radius:12px}
#fbtn .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-fill);font-family:var(--f-mono);font-size:11px}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.filters{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.filters.open{display:block}
.grp{padding-block:12px;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;max-width:100%}
.chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--dot)}
.chip .n{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chip.zero{opacity:.42}
.chip[aria-pressed="true"]{background:var(--dot);border-color:var(--dot);color:var(--on-fill)}
.chip[aria-pressed="true"] i{background:var(--on-fill)}
.chip[aria-pressed="true"] .n{color:inherit}
.chip.zero[aria-pressed="true"]{opacity:1}
.k-talent{--dot:var(--ink)} .k-genre{--dot:var(--genre)} .k-sub{--dot:var(--sub)} .k-collabIn,.k-collabOut,.k-cast{--dot:var(--collab)} .k-status,.k-kind,.k-away,.k-chan,.k-platform{--dot:var(--ink2)}
.more{margin-top:8px}
.nogrp{margin:0;padding:10px 0;color:var(--ink2);font-size:13px}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar .count{font-family:var(--f-mono);font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.toolbar select{min-height:38px;padding:0 10px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:14px}

/* list */
.month{display:flex;align-items:baseline;gap:10px;margin:22px 0 2px;font-family:var(--f-display);font-size:16px;font-weight:800}
.month small{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.list{list-style:none;margin:0;padding:0}
.row{padding:14px 0;border-top:1px solid var(--line)}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink2)}
.date{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.talent{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:0;border-radius:8px;background:var(--mute-bg);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(128,128,128,.28)}
.talent:hover{box-shadow:inset 0 0 0 2px currentColor}
.req{margin-left:auto;font-size:12.5px;color:var(--ink2);text-underline-offset:4px}
.req:hover{color:var(--ink)}
.title{display:block;margin:2px 0 8px;font-size:16.5px;font-weight:700;line-height:1.5;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
a.title:hover{color:var(--accent)}
.title.nolink{font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:0;border-radius:8px;background:var(--tint);color:var(--tink);font-size:12.5px;cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:left}
.tag.kind{--tint:var(--ink);--tink:var(--bg);font-weight:700}
.tag.genre{--tint:var(--genre-tint);--tink:var(--genre-ink);font-weight:700}
.tag.sub{--tint:var(--sub-tint);--tink:var(--sub-ink)}
.tag.chan{--tint:var(--mute-bg);--tink:var(--ink)}
.tag.collab{--tint:var(--collab-tint);--tink:var(--collab-ink)}
.tag .bx{margin-left:6px;padding:1px 5px;border-radius:4px;background:var(--collab);color:var(--on-fill);font-size:10.5px;font-weight:700}
.hint{margin:0 0 8px;font-size:12px;color:var(--ink2)}
.tag[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
.desc{margin:0 0 8px;font-size:13.5px;color:var(--ink2);overflow-wrap:anywhere}
.reason{margin:0 0 8px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.st{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border:0;border-radius:6px;font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.03em;cursor:pointer}
.st[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
.st.members{background:var(--mem-tint);color:var(--mem-ink)}
.st.private{background:var(--line);color:var(--ink2)}
.kd{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line2);font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink)}
.kd.away{border-color:var(--collab);background:var(--collab-tint);color:var(--collab-ink)}
.kd.twitch{border-color:#9146FF;background:#EFE6FF;color:#5B21B6}
@media (prefers-color-scheme: dark){.kd.twitch{background:#2A1F4A;color:#C9B0FF}}
/* 非公開の行は枠ごとグレーアウトします */
.row.private{margin:8px 0;padding:14px;background:var(--mute-bg);border:1px dashed var(--line2);border-radius:12px;color:var(--ink2);filter:grayscale(1)}
.row.private .title{color:var(--ink2);font-weight:500;letter-spacing:.02em}
.row.private .tag{opacity:.75}
.showmore{display:flex;justify-content:center;padding:20px 0}
.tools{display:flex;gap:8px}
.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:24px 0 4px}
.pg{min-width:40px;min-height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:13px}
.pg:hover:not(:disabled){border-color:var(--ink2)}
.pg.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pg:disabled{opacity:.4;cursor:default}
.pgap{color:var(--ink2);padding:0 2px}
.empty{padding:36px 4px;color:var(--ink2)}
.empty h2{margin:0 0 6px;font-size:18px;color:var(--ink)}
.empty p{margin:0 0 16px;max-width:52ch}

/* talent pages */
.profile{margin:4px 0 8px}
.profile p{margin:10px 0 0;max-width:60ch;color:var(--ink2)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px}
.links a{text-underline-offset:4px}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:36px;margin-top:6px;font-size:13px;color:var(--ink2);cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.tlist{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.tcard{display:block;height:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
.tcard:hover{border-color:var(--ink2)}
.tcard h2{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:17px}
.tcard p{margin:0;font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .n{display:block;margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--ink2)}

.foot{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}

@media (min-width:880px){
  .layout{grid-template-columns:268px minmax(0,1fr);gap:32px;align-items:start}
  .filters{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow-y:auto}
  #fbtn{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .chip,.btn,.tag,.tcard{transition:background-color .12s,border-color .12s,color .12s}
}

/* スマホ: 絞り込みを左から出るパネルにする */
.fclose,.fback{display:none}
@media (max-width:879.98px){
  .filters{display:block;position:fixed;top:0;bottom:0;left:0;z-index:30;width:min(86vw,340px);overflow-y:auto;
    border-radius:0 16px 16px 0;border-left:0;
    padding:calc(56px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
    transform:translateX(-105%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
  .filters.open{transform:none;visibility:visible;transition:transform .2s ease}
  .filters.open ~ .fback{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5)}
  .filters.open ~ .fclose{display:flex;align-items:center;position:fixed;top:0;left:0;z-index:31;width:min(86vw,340px);height:calc(48px + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 14px 0 max(14px,env(safe-area-inset-left,0px));border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;text-align:left}
}
@media (prefers-reduced-motion:reduce){.filters{transition:none!important}}

/* 合言葉の入力(暗号化して公開するとき) */
.gate{max-width:420px;margin:32px 0}
.gate label:not(.opt){display:block;font-weight:700;margin-bottom:8px}
.gate .grow{display:flex;gap:8px}
.gate input[type=password]{flex:1;min-width:0;min-height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--ink)}
.gate .btn{min-height:46px;border-radius:12px;padding:0 18px}
.gate .opt{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink2);font-size:13px}
.gmsg{min-height:1.4em;margin:10px 0 0;color:var(--accent);font-size:13px}
body.locked .bar,body.locked .layout,body.locked .lede,body.locked .foot{display:none}

</style>
</head>
<body data-page="index">
<div class="wrap" id="app">
  <header class="site">
    <span class="brand">ななしいんく配信アーカイブ</span>
    <nav aria-label="メニュー">
    </nav>
  </header>

  <h1>配信一覧</h1>
  <section id="gate" class="gate" hidden>
    <form id="gform" autocomplete="off">
      <label for="gpass">合言葉を入力してください</label>
      <div class="grow"><input id="gpass" type="password" autocomplete="current-password" enterkeyhint="go"><button class="btn" id="gbtn" type="submit">開く</button></div>
      <label class="opt"><input id="gkeep" type="checkbox" checked><span>このブラウザに覚えておく</span></label>
      <p id="gmsg" class="gmsg" role="status"></p>
    </form>
  </section>
  <p class="lede" id="lede">読み込み中…</p>

  <div class="bar">
    <div class="search"><input id="q" type="search" placeholder="タイトル・タグで検索" autocomplete="off" enterkeyhint="search" aria-label="検索"></div>
    <button class="btn" type="button" id="fbtn" aria-expanded="false" aria-controls="filters">絞り込み<span class="badge" id="fbadge" hidden>0</span></button>
  </div>
  <div class="quick" id="quick"></div>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="絞り込み"></aside>
    <button type="button" class="fclose" id="fclose">✕ 閉じる</button>
    <div class="fback" id="fback"></div>
    <main>
      <div class="active" id="active"></div>
      <div class="toolbar">
        <span class="count" id="count"></span>
        <div class="tools">
          <label><span style="position:absolute;left:-9999px">並び順</span>
            <select id="sort"><option value="desc">新しい順</option><option value="asc">古い順</option></select>
          </label>
          <label><span style="position:absolute;left:-9999px">表示数</span>
            <select id="per"><option value="10">10件ずつ</option><option value="20" selected>20件ずつ</option><option value="50">50件ずつ</option><option value="100">100件ずつ</option></select>
          </label>
        </div>
      </div>
      <div id="list"><p class="empty">読み込み中…</p></div>
    </main>
  </div>

  <footer class="foot">非公式のファンサイトです。掲載内容に誤りがあれば、お知らせください。</footer>
</div>
<script>
/* サイトの設定ファイルです。ここだけ書き換えれば反映されます。 */
window.SITE_CONFIG = {
  /* 合言葉つきで公開するときは encrypt_data.py が、公開用フォルダ(public)の中で true にします。ここは変えなくて大丈夫です。 */
  encrypted: false,
  /* リクエストや訂正の連絡を受け付けるページのURL。
     例）GitHub Issues: "https://github.com/ユーザー名/リポジトリ名/issues/new"
     例）Googleフォーム: "https://forms.gle/xxxxxxxx"
     空欄("")のままなら、リクエストのリンクは表示されません。 */

  }
  function tagBtn(gid, label, cls, noBx) {
    var tc = (gid === 'collabIn' || gid === 'collabOut') ? TAL_COLOR[norm(label)] : null,
      sty = tc ? ' style="background:' + tc.bg + ';color:' + tc.ink + '"' : '';
    var pre = gid === 'chan' ? '配信元：' : '', bx = gid === 'collabOut' && !noBx ?'<small class="bx">外部</small>' : '';
    if (!st.f[gid]) return '<span class="tag ' + cls + '"' + sty + '>' + pre + esc(label) + bx + '</span>';
    var on = st.f[gid].has(norm(label));
    return '<button type="button" class="tag ' + cls + '"' + sty + ' data-f="' + gid + '" data-k="' + esc(norm(label)) + '" aria-pressed="' + on + '">' +
      pre + esc(label) + bx + '</button>';
  }
  function rowHtml(it) {
    var priv = it.status === 'private', mem = it.status === 'members';
    var url = safeUrl(it.url);
    var tt = it.title || (priv ? PRIVATE_TITLE : '');
    var title = (url && !priv) ? '<a class="title" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(tt) + '</a>'
      : '<span class="title nolink">' + esc(tt) + '</span>';
    var badge = (mem || priv) ? '<button type="button" class="st ' + it.status + '" data-f="status" data-k="' + esc(norm(STATUS_LABEL[it.status])) + '" aria-pressed="' + (st.f.status.has(norm(STATUS_LABEL[it.status]))) + '" title="この公開状態で絞り込む">' + STATUS_LABEL[it.status] + '</button>' : '';
    var away = it.away ? '<span class="kd away">他チャンネル出演</span>' : '';
    var tw = it.twitch ? '<span class="kd twitch">Twitch</span>' : '';
    var tags = '';
    if (it.kind !== 'live') tags += tagBtn('kind', KIND_LABEL[it.kind], 'kind');
    it.genres.forEach(function (g) { tags += tagBtn('genre', g, 'genre'); });
    it.subs.forEach(function (s) { tags += tagBtn('sub', s, 'sub'); });
    if (it.chan) tags += tagBtn('chan', it.chan, 'chan');
    it.collabIn.forEach(function (c) { tags += tagBtn('collabIn', c, 'collab'); });
    it.collabOut.forEach(function (c) { tags += tagBtn('collabOut', c, 'collab', it.regKeys.has(norm(c))); });
    return '<li class="row' + (priv ? ' private' : '') + (mem ? ' members' : '') + '"><div class="meta"><time class="date">' + esc(fmtDate(it.date)) + '</time>' + tw + away + badge +
      (it.talent ? '<button type="button" class="talent"' + (it.color ? ' style="background:' + it.color.bg + ';color:' + it.color.ink + '"' : '') + ' data-f="cast" data-k="' + esc(norm(it.talent)) + '" title="この配信者で絞り込む">' + esc(it.talent) + '</button>' : '') +
      (REQ_URL ? '<a class="req" href="' + esc(reqHref(it)) + '" target="_blank" rel="noopener noreferrer">訂正を連絡</a>' : '') +
      '</div>' + title + (priv && it.reason ? '<p class="reason">※' + esc(it.reason) + '</p>' : '') +
      (it.memo ? '<p class="desc">' + esc(it.memo) + '</p>' : '') + (tags ? '<div class="tags">' + tags + '</div>' : '') + '</li>';
  }
  function pagerHtml(total) {
    if (total < 2) return '';
    var cur = st.page;
    var set = [1, total, cur - 1, cur, cur + 1].filter(function (n) { return n >= 1 && n <= total; });
    set = Array.from(new Set(set)).sort(function (a, b) { return a - b; });
    var h = '<nav class="pager" aria-label="ページ送り"><button type="button" class="pg" data-pg="' + (cur - 1) + '"' + (cur < 2 ? ' disabled' : '') + '>‹ 前へ</button>';
    var prev = 0;
    set.forEach(function (n) {
      if (prev && n - prev > 1) h += '<span class="pgap">…</span>';
      h += '<button type="button" class="pg' + (n === cur ? ' cur' : '') + '" data-pg="' + n + '"' + (n === cur ? ' aria-current="page"' : '') + '>' + n + '</button>';
      prev = n;
    });
    return h + '<button type="button" class="pg" data-pg="' + (cur + 1) + '"' + (cur >= total ? ' disabled' : '') + '>次へ ›</button></nav>';
  }
  function scrollToList() {
    try { var t = $('.toolbar').getBoundingClientRect().top + window.pageYOffset - 70; window.scrollTo({ top: Math.max(0, t) }); } catch (e) { /* ignore */ }
  }
  function renderList() {
    var el = $('#list'), cnt = $('#count');
    if (!st.items.length) {
      el.innerHTML = '<div class="empty"><h2>まだ配信が登録されていません</h2><p>archives.csv に配信を追加すると、ここに表示されます。</p></div>';
      cnt.textContent = ''; return;
    }
    var rows = visible();
    cnt.textContent = rows.length + ' 件を表示' + (rows.length !== st.items.length ? '（全 ' + st.items.length + ' 件）' : '');
    if (!rows.length) {
      el.innerHTML = '<div class="empty"><h2>条件に合う配信がありません</h2><p>検索語を短くするか、絞り込みを外してみてください。</p><button class="btn" type="button" data-clear>検索と絞り込みを解除</button></div>';
      return;
    }
    var perMonth = {};
    rows.forEach(function (r) { var k = r.date ? r.date.slice(0, 7) : ''; perMonth[k] = (perMonth[k] || 0) + 1; });
    var pages = Math.max(1, Math.ceil(rows.length / st.per));
    if (st.page > pages) st.page = pages;
    var from = (st.page - 1) * st.per;
    cnt.textContent = rows.length + ' 件中 ' + (from + 1) + '〜' + Math.min(from + st.per, rows.length) + ' 件を表示' +
      (rows.length !== st.items.length ? '（全 ' + st.items.length + ' 件）' : '');
    var out = '', cur = null, open = false;
    rows.slice(from, from + st.per).forEach(function (it) {
      var key = it.date ? it.date.slice(0, 7) : '';
      if (key !== cur) {
        if (open) out += '</ul>';
        out += '<h2 class="month">' + (key ? esc(key.slice(0, 4) + '年' + (+key.slice(5)) + '月') : '日付なし') + '<small>' + perMonth[key] + '件</small></h2><ul class="list">';
        cur = key; open = true;
      }
      out += rowHtml(it);
    });
    if (open) out += '</ul>';
    out += pagerHtml(pages);
    el.innerHTML = out;
  }
  function renderQuick() {
    $('#quick').innerHTML = ['video', 'short', 'private'].map(function (k) {
      return '<label class="opt"><input type="checkbox" data-hide="' + k + '"' + (st.hide.has(k) ? ' checked' : '') + '><span>' + HIDE_LABEL[k] + 'を表示しない</span></label>';
    }).join('');
  }
  function renderAll() { renderQuick(); renderFilters(); renderActive(); renderList(); writeUrl(); }

  /* 検索条件をURLに残して、同じ条件のリンクを共有できるようにします */
  function writeUrl() {
    try {
      var p = new URLSearchParams();
      (cfg.keepParams || []).forEach(function (k) {
        var v = new URLSearchParams(location.search).get(k); if (v) p.set(k, v);
      });
      if (st.q.trim()) p.set('q', st.q.trim());
      if (st.sort === 'asc') p.set('sort', 'asc');
      if (st.per !== DEFAULT_PER) p.set('per', String(st.per));
      if (st.page > 1) p.set('p', String(st.page));
      if (st.only && st.f.cast && st.f.cast.size >= 2) p.set('only', '1');
      G.forEach(function (g) { st.f[g.id].forEach(function (k) { p.append(g.param, k); }); });
      st.hide.forEach(function (k) { p.append('hide', k); });
      var s = p.toString();
      history.replaceState(null, '', s ? '?' + s : location.pathname);
    } catch (e) { /* ignore */ }
  }
  function readUrl() {
    var p = new URLSearchParams(location.search);
    st.q = p.get('q') || '';
    st.sort = p.get('sort') === 'asc' ? 'asc' : 'desc';
    var per = parseInt(p.get('per'), 10);
    st.per = PER_OPTIONS.indexOf(per) >= 0 ? per : DEFAULT_PER;
    st.page = Math.max(1, parseInt(p.get('p'), 10) || 1);
    st.only = p.get('only') === '1';
    st.hide = new Set(p.getAll('hide').filter(function (k) { return k === 'video' || k === 'short' || k === 'private'; }));
    $('#q').value = st.q; $('#sort').value = st.sort; $('#per').value = String(st.per);
    G.forEach(function (g) { p.getAll(g.param).forEach(function (k) { st.f[g.id].add(norm(k)); }); });
    p.getAll('who').forEach(function (k) { st.f.cast.add(norm(k)); }); /* 昔のURL(?who=)も使えるように */
  }

  function toggle(gid, key) {
    var s = st.f[gid]; if (!s) return;
    if (s.has(key)) s.delete(key); else s.add(key);
    st.page = 1; renderAll();
  }
  function clearAll() {
    G.forEach(function (g) { st.f[g.id].clear(); });
    st.only = false; st.hide.clear();
    st.q = ''; $('#q').value = ''; st.page = 1; renderAll();
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    var hd = t.closest('[data-hide]');
    if (hd) { var hk = hd.getAttribute('data-hide'); if (st.hide.has(hk)) st.hide.delete(hk); else st.hide.add(hk); st.page = 1; renderAll(); return; }
    var lo = t.closest('[data-only]'); if (lo) { st.only = !!lo.checked; st.page = 1; renderAll(); return; }
    var f = t.closest('[data-f]'); if (f) { toggle(f.getAttribute('data-f'), f.getAttribute('data-k')); return; }
    var m = t.closest('[data-more]'); if (m) { var id = m.getAttribute('data-more'); st.expanded[id] = !st.expanded[id]; renderFilters(); return; }
    if (t.closest('[data-clear]')) { clearAll(); return; }
    var pg = t.closest('[data-pg]');
    if (pg && !pg.disabled) { st.page = parseInt(pg.getAttribute('data-pg'), 10) || 1; renderList(); writeUrl(); scrollToList(); }
  });
  $('#q').addEventListener('input', function (e) { st.q = e.target.value; st.page = 1; renderFilters(); renderActive(); renderList(); writeUrl(); });
  $('#sort').addEventListener('change', function (e) { st.sort = e.target.value; st.page = 1; renderList(); writeUrl(); });
  $('#per').addEventListener('change', function (e) { st.per = parseInt(e.target.value, 10) || DEFAULT_PER; st.page = 1; renderList(); writeUrl(); });
  /* スマホでは、絞り込みを左から出るパネルにする。外側か「閉じる」で閉じる */
  function setFilters(o) { $('#filters').classList.toggle('open', o); $('#fbtn').setAttribute('aria-expanded', String(o)); }
  $('#fbtn').addEventListener('click', function () { setFilters(!$('#filters').classList.contains('open')); });
  $('#fclose').addEventListener('click', function () { setFilters(false); });
  $('#fback').addEventListener('click', function () { setFilters(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setFilters(false); });

  readUrl(); rebase(); renderAll();
  return { rebase: function () { st.page = 1; rebase(); renderAll(); } };
}

/* ---------- ページごとの起動 ---------- */
function fail(msg) {
  var el = $('#list') || $('#app');
  if (el) el.innerHTML = '<div class="empty"><h2>データを読み込めませんでした</h2><p>' + esc(msg) + '</p></div>';
  var l = $('#lede'); if (l) l.textContent = '';
}
var LOAD_HELP = 'archives.csv が同じ場所にあるか確認してください。ファイルを直接開いている場合は、make_data.py（または make_data.js）を実行して data.js を作ると表示されます。';

function bootIndex(data) {
  var talents = new Set(data.items.filter(function (i) { var t = data.talents.byName.get(norm(i.talent)); return t && t.reg; })
    .map(function (i) { return norm(i.talent); }).filter(Boolean));
  var ds = data.items.map(function (i) { return i.date; }).filter(Boolean).sort();
  var ymd = function (d) { return d.replace(/-/g, '/'); };
  $('#lede').innerHTML = '全 ' + data.items.length + ' 件' + (talents.size ? ' ／ ' + talents.size + ' 人' : '') +
    (ds.length ? '<br>' + ymd(ds[0]) + ' 〜 ' + ymd(ds[ds.length - 1]) + ' の配信' : '');
  createBrowser({
    groups: ['cast', 'genre', 'sub', 'collabIn', 'collabOut', 'away', 'chan', 'platform', 'kind', 'status'], hasBox: data.hasBox, all: data.items, talents: data.talents,
    base: function () { return function () { return true; }; }
  });
}

/* ---------- 合言葉(暗号化して公開するとき) ---------- */
var PASS_KEY = 'archive-pass';
function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function decryptBundle(enc, pass) {
  var sub = window.crypto && window.crypto.subtle;
  if (!sub || !window.DecompressionStream) return Promise.reject(new Error('unsupported'));
  return sub.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (km) {
    return sub.deriveKey({ name: 'PBKDF2', salt: unb64(enc.salt), iterations: enc.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }).then(function (key) {
    return sub.decrypt({ name: 'AES-GCM', iv: unb64(enc.iv) }, key, unb64(enc.data));
  }).then(function (buf) {
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }).then(function (txt) { return JSON.parse(txt); });
}
function lsGet() { try { return localStorage.getItem(PASS_KEY); } catch (e) { return null; } }
function lsSet(v) { try { if (v == null) localStorage.removeItem(PASS_KEY); else localStorage.setItem(PASS_KEY, v); } catch (e) { } }
function unlock() {
  if (!(window.SITE_CONFIG && window.SITE_CONFIG.encrypted)) return Promise.resolve();
  var gate = $('#gate'), form = $('#gform'), msg = $('#gmsg');
  document.body.classList.add('locked');
  return fetch('data.enc', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('data.enc ' + r.status); return r.json(); }).then(function (enc) {
    function done(bundle, pass, remember) {
      window.SITE_DATA = bundle; lsSet(remember ? pass : null);
      document.body.classList.remove('locked'); gate.hidden = true;
    }
    var saved = lsGet();
    var first = saved ? decryptBundle(enc, saved).then(function (b) { done(b, saved, true); return true; }).catch(function () { lsSet(null); return false; }) : Promise.resolve(false);
    return first.then(function (ok) {
      if (ok) return;
      gate.hidden = false;
      return new Promise(function (resolve) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var pass = $('#gpass').value; if (!pass) return;
          msg.textContent = '確認しています…'; $('#gbtn').disabled = true;
          decryptBundle(enc, pass).then(function (b) { done(b, pass, $('#gkeep').checked); resolve(); }).catch(function (err) {
            $('#gbtn').disabled = false;
            msg.textContent = (err && err.message === 'unsupported') ? 'このブラウザでは開けません。新しいバージョンのChrome・Safari・Firefoxで開いてください。' : '合言葉が違います。';
          });
        });
      });
    });
  });
}

unlock().then(loadData).then(function (data) {
  setupRequest();
  bootIndex(data);
}).catch(function (e) {
  fail(LOAD_HELP);
  if (window.console) console.error(e);
});
})();

</script>
